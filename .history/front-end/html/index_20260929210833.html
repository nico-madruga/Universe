<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://fonts.googleapis.com/css?family=JetBrains Mono' rel='stylesheet'>
    <link rel="stylesheet" href="../css/style.css">
    <title>Universe</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <img src="/front-end/imgs/Vector 1.svg">
    </header>


    <main class="layout">

        <aside class="sidebar">

            <h2>EXPLORER</h2>

            <nav>
                <button id="stars-button" class="standard_button">Stars</button>
                <button id="planets-button" class="standard_button">Planets</button>
                <button id="systems-button" class="standard_button">Star Systems</button>
                <button id="galaxies-button" class="standard_button">Galaxies</button>
            </nav>

        </aside>

                <div class="star star-1"></div>
                <div class="star star-2"></div>
                <div class="star star-3"></div>

                <div class="planet"></div>

            <section class="object-info">

                <h2>DETAILS</h2>

                <div class="info-grid">

                    <p>
                        <strong>Name:</strong>
                        Earth
                    </p>

                    <p>
                        <strong>Type:</strong>
                        Planet
                    </p>

                    <p>
                        <strong>Mass:</strong>
                        —
                    </p>

                    <p>
                        <strong>Temperature:</strong>
                        —
                    </p>

                </div>

            </section>

        </section>

    </main>
    
    <footer class="controls">
        <h2>CONTROLS</h2>

        <div class="control-buttons">
            <button class="control-button">FOCUS</button>
            <button class="control-button">3D VIEW</button>
            <button class="control-button">ORBIT</button>
        </div>
    </footer>
<script src="/front-end/js/main.js"></script>
</body>
</html>
