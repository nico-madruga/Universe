<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Universe</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="navbar">
        <h1>🌌 Universe</h1>

        <input
            type="text"
            placeholder="Search the universe..."
            id="search"
        >
    </header>


    <main class="layout">

        <aside class="sidebar">

            <h2>Explorer</h2>

            <nav>
                <button>★ Stars</button>
                <button>🪐 Planets</button>
                <button>☀ Star Systems</button>
                <button>🌌 Galaxies</button>
            </nav>

        </aside>


        <section class="content">

            <section class="space">

                <div class="star star-1"></div>
                <div class="star star-2"></div>
                <div class="star star-3"></div>

                <div class="planet"></div>

            </section>


            <section class="object-info">

                <h2>Selected Object</h2>

                <div class="info-grid">

                    <p>
                        <strong>Name:</strong>
                        Earth
                    </p>

                    <p>
                        <strong>Type:</strong>
                        Planet
                    </p>

                    <p>
                        <strong>Mass:</strong>
                        —
                    </p>

                    <p>
                        <strong>Temperature:</strong>
                        —
                    </p>

                </div>

            </section>

        </section>

    </main>

</body>
</html>
